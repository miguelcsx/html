<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio 2 - Lista dinamica</title>
<link rel="stylesheet" href="arena.css">
</head>
<body>
<div class="card list">
<a class="back" href="index.html">&larr; volver</a>
<h1>Lista dinamica</h1>
<div class="row">
<input id="texto" type="text" placeholder="Nuevo item">
<button onclick="agregar()">Agregar</button>
</div>
<ul id="lista"></ul>
<script>
const items = [];

function agregar() {
  const input = document.getElementById('texto');
  if (!input.value) return;
  items.push(input.value);
  input.value = '';
  render();
}

function render() {
  document.getElementById('lista').innerHTML = items.map(i => `<li>${i}</li>`).join('');
}
</script>
</div>
</body>
</html>

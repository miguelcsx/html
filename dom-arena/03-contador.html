<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio 3 - Contador con limite</title>
<link rel="stylesheet" href="arena.css">
</head>
<body>
<div class="card">
<a class="back" href="index.html">&larr; volver</a>
<p class="eyebrow">Ejercicio 03</p>
<h1>Contador con limite</h1>
<button onclick="cambiar(-1)">-</button>
<span id="valor">0</span>
<button onclick="cambiar(1)">+</button>
<script>
let contador = 0;

function cambiar(delta) {
  contador += delta;
  document.getElementById('valor').textContent = contador;
  if (contador >= 10) alert('Llegaste a 10');
}
</script>
</div>
</body>
</html>
